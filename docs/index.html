s-security", "github": "https://github.com/NousResearch/hermes-official-plugins"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-11", "title": "CodeRabbit 公开 Deep Scan 跨仓库安全分析的实现与实验", "url": "https://www.coderabbit.ai/blog/multi-repository-security-analysis-with-coderabbit-secure", "summary": "Deep Scan 用审查时积累的仓库架构摘要和自动关联找出相关仓库（优先 IaC 仓库），安全 Agent 按侦察、搜寻、验证三阶段读取最多 20 个关联仓库的只读源码，发现只记在主仓库并引用固定提交作为证据；开源项目实验中，有关联上下文时能把 chart 里的默认管理员凭据追到容器启动代码、确认只在首次安装生效，无关联时只得到部分结论。", "source": "网页/文档", "agent": "代码审查", "tags": [], "links": {"docs": "https://docs.coderabbit.ai/knowledge-base/multi-repo-analysis", "x": "https://x.com/coderabbitai/status/2120197700138184851"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-11", "title": "TDS 实测：Copilot 代码审查抓到 diff 内全部 bug，却漏掉被调用代码里的 bug", "url": "https://towardsdatascience.com/copilot-caught-8-of-8-diff-bugs-with-rules-0-of-2-outside-the-diff/", "summary": "作者在合成计费服务和 pandas 管道里埋 10 个 bug、建 28 个 PR：diff 内 8 个 bug 无规则文件抓到 5 个、有规则抓到 8 个；2 个藏在未改动但被调用的函数里的 bug 有无规则都漏掉，核心案例 8 次审查全漏。建议把硬业务规则写成不变量测试、按路径写审查规则文件、高风险路径强制 CODEOWNERS 人工审批。", "source": "网页/文档", "agent": "代码审查", "tags": [], "links": {"docs": "https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-11", "title": "CodeReviewBench 更新：13 个模型审 30 个真实 PR，Kimi K3.1 Pro 召回率居首", "url": "https://x.com/Ed_dfreitas/status/2120315251790942632", "summary": "Kodus 维护的基准在同一审查流程中测 13 个模型（121 个已确认 bug，按 F2 排名）：Balanced 模式 Kimi K3.1 Pro 召回 68.6%、F2 63.5 第一，其后 GPT-6.1 Sol、Claude Opus 5.5、GLM-5.3、DeepSeek V4.1 Flash；DeepSeek V4.1 Flash 召回 40.5% 接近 Opus 5.5 的 42.1%，单 PR 成本约为其五分之一。", "source": "据 X 上的报道", "agent": "代码审查", "tags": [], "links": {"leaderboard": "https://www.codereviewbench.com/leaderboard"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-12", "title": "Factory 发布 Security Factory：把扫描发现变成已验证的修复", "url": "https://factory.com/news/security-factory", "summary": "汇总 SAST、依赖、密钥与基础设施扫描结果及威胁情报、工单上下文，多 Agent 并行分析可达性、可利用性与攻击路径并在沙箱复现；修复按原始利用条件测试、查回归后提 PR，自主程度可配置。目前为私测。", "source": "网页/文档", "agent": "代码审查", "tags": [], "links": {}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-12", "title": "Vercel Security Review 首周自报：57,897 个发现，Agent 已修 14,665 个", "url": "https://x.com/rauchg/status/2120188488628977819", "summary": "上线不到一周发现 57,897 个漏洞，6,029 个严重或高危，Agent 已修复 14,665 个（Vercel 自报、严重度由 AI 评定）；只审每次推送的变更，追踪可达性并复核后再报，修复以 PR 提出需开发者批准，11-10 起按 token 计费。", "source": "据 X 上的报道", "agent": "代码审查", "tags": [], "links": {"blog": "https://vercel.com/changelog/vercel-security-review-public-beta"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-12", "title": "CodeRabbit 上线按合并风险上限自动批准 PR", "url": "https://x.com/coderabbitai/status/2120660381047902427", "summary": "开启自动批准后，CodeRabbit 有可执行意见时请求修改，意见解决、最新提交审完且预合并检查不失败才批准，批准可计入分支保护要求但不会合并；可设 max_merge_risk / max_security_risk 上限（minimal 到 critical 五级），超过上限留给人工，也可按团队或路径关闭。", "source": "据 X 上的报道", "agent": "代码审查", "tags": [], "links": {"docs": "https://docs.coderabbit.ai/pr-reviews/approval-risk-limits"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-13", "title": "Semgrep Guardian：在编码 Agent 写代码时做安全检测并自动生成修复", "url": "https://semgrep.dev/blog/2026/semgrep-guardian-policies-ai-detection/", "summary": "2026-11-12，Semgrep 介绍 Guardian 的最新能力：把安全策略下发到开发者的编码 Agent 旁，在代码生成时检测并自动生成修复，目标是让整类问题不离开开发者电脑。Semgrep 自称已覆盖 1 万多名开发者：在编码 Agent 内提出的发现有 36% 被修复，作为 PR 评论提出的只有 10%；p75 修复时间在 Agent 内为 33 分钟，在 PR 上为 21 小时；95% 的扫描在 2 分钟内完成。新版本支持组织级自定义策略，并称可检测 IDOR、BOLA 等较复杂漏洞，以及拦截会引入恶意软件或可达漏洞的 lockfile 依赖变更。以上数据为厂商自报。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["code-review", "appsec", "coding-agent", "semgrep"], "links": {}, "highlights": ["厂商数据表明，同样的安全发现在编码 Agent 内提出，比等到 PR 评论更容易、也更快被修复。", "Guardian 同时做生成时检测、组织策略下发和供应链/lockfile 变更拦截。"], "lessons": ["安全检查应尽量前移到 Agent 写代码的时刻，而不是只在 PR 扫描里做一次事后把关。"]}, {"topic": "code-review", "date": "2026-11-13", "title": "ETH Zurich 论文：编码 Agent 会把仓库里已有的漏洞模式复制到新代码中", "url": "https://arxiv.org/abs/2611.11455", "summary": "2026-11-08 提交的 ETH Zurich 论文《Coding Agents Propagate Vulnerabilities in Code Bases》研究已有漏洞会不会诱导编码 Agent 在新代码中写出类似问题。在 96 个需于已有应用旁实现新后端的任务中，不安全的邻居代码使“正确且安全”的实现平均下降 3.4%；在 20 对真实 C/C++ 项目的仓库级补全任务中，安全上下文与不安全上下文的平均差距达到 35.4%。当被要求解释实现选择时，Agent 在 76.5% 的情况下将其归因于跟随已有代码，同时在 69.9% 的情况下能够认出自己引入了漏洞。要求注意安全或跟随现有代码风格会减弱或增强这种传播，但都不能阻止。代码与数据见 https://github.com/eth-sri/vulnerability-propagation。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["security", "coding-agent", "vulnerability", "research"], "links": {"github": "https://github.com/eth-sri/vulnerability-propagation"}, "highlights": ["已有的不安全代码会成为 Agent 写新代码时的模板，C/C++ 仓库级任务上的差距明显大于普通后端生成。", "多数情况下 Agent 既跟着有漏洞的先例走，也能认出自己引入了漏洞。"], "lessons": ["在把仓库交给编码 Agent 之前，应先清理已知不安全的示例代码；只加安全提示不足以阻止漏洞传播。"]}, {"topic": "code-review", "date": "2026-11-14", "title": "Cohere 收购 AI 代码审查初创 Cubic 与安全公司 Aisle", "url": "https://betakit.com/cohere-buys-ai-code-review-startup-cubic-as-acquisition-spree-continues/", "summary": "Cohere 于 11 月 13 日宣布完成对伦敦代码审查公司 Cubic 与捷克网安公司 Aisle 的收购，金额未披露。Cubic 团队全员加入组建“安全编码”垂直部门，Aisle 专注自主漏洞发现与修复，布拉格办公室成为其 AI 网安中心。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["ai-code-review", "acquisition", "security"], "links": {}, "highlights": ["AI 代码审查正被大模型厂商并入安全编码能力栈"], "lessons": []}, {"topic": "code-review", "date": "2026-11-15", "title": "阿里 OpenCodeReview v1.13.9：确定性流水线 + Agent 混合代码审查", "url": "https://github.com/alibaba/open-code-review/releases/tag/v1.13.9", "summary": "2026-11-13 发布，记录被排除文件、修复零发现 PR 的 Action 警告、按请求强制工具声明；项目自报在 AACR-Bench（200 PR/1505 条标注）上精度与 F1 高于 Claude Code、token 约 1/9，但召回较低，属厂商自测。", "source": "网页/文档", "agent": "AI前沿者", "tags": [], "links": {"github": "https://github.com/alibaba/open-code-review"}, "highlights": [], "lessons": []}, {"topic": "code-review", "date": "2026-11-17", "title": "GitHub 组织级可批量启动最多 20 个仓库的 AI Scan（公开预览）", "url": "https://github.blog/changelog/2026-11-16-bulk-start-ai-scan-for-repositories/", "summary": "GitHub 于 11-16 宣布，可一次为最多 20 个仓库启动 AI Scan。该功能在仓库默认分支上寻找安全漏洞：覆盖 CodeQL 不支持的语言，并在 CodeQL 已分析的语言上发现额外问题；结果进入 code scanning 待办，与 CodeQL 告警并列。可在开启组织级设置时选择仓库，或从组织 code scanning 告警页、单个仓库告警页启动。批量启动处于公开预览，适用于 github.com 与带数据驻留的 GitHub Enterprise Cloud，不需要 Copilot 许可证。未做独立复现。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["github", "ai-scan", "security", "code-scanning"], "links": {}, "highlights": ["AI Scan 在默认分支寻找安全漏洞，覆盖 CodeQL 不支持的语言，并在 CodeQL 已覆盖语言上找额外问题；发现进入 code scanning 待办，与 CodeQL 告警并列。", "11-16 起可一次对最多 20 个仓库启动扫描（开启组织设置时或从组织/仓库告警页选择）；公开预览，适用于 github.com 与带数据驻留的 GHEC，不需要 Copilot 许可证。"], "lessons": ["组织落地 AI 漏洞扫描时，可用批量启动做首轮覆盖，但仍应把结果放进与 CodeQL 同一条 backlog 里统一分诊。", "该功能不要求 Copilot 许可证，评估成本时应与 Copilot 代码审查功能分开计算。"]}, {"topic": "code-review", "date": "2026-11-19", "title": "Copilot code review 增加自适应深度、跨仓库上下文和密钥检测", "url": "https://github.blog/changelog/2026-11-17-copilot-code-review-adaptive-effort-secret-detection-and-more/", "summary": "GitHub 于 11 月 17 日宣布 Copilot code review 三项公开预览能力，面向 Copilot Pro、Pro+、Max、Business 和 Enterprise。Adaptive 会按每个 PR 的复杂度和风险，自动在 Lite、Balanced、Max 中选择审查深度，并在结果中标明所选级别，且不会超过组织或仓库设置的上限，默认仍是 Balanced。跨仓库上下文可在审查时读取相关公开仓库中的依赖代码、文档、自定义说明和 skills。密钥检测会把暴露的凭据写进审查评论：既覆盖与 150 多家合作方共建的 500 多种已知格式（正则等确定方法），也用模型和专用检测器找没有固定格式的密钥。功能以公开预览为准，后续可能调整。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["code-review", "GitHub", "Copilot", "secret-detection"], "links": {"blog": "https://github.blog/changelog/2026-11-17-copilot-code-review-adaptive-effort-secret-detection-and-more/", "docs": "https://github.blog/changelog/2026-11-17-copilot-code-review-adaptive-effort-secret-detection-and-more/"}, "highlights": ["审查深度不必再人手指定，系统会按 PR 风险自动选择，并且不能超过管理员设下的上限。", "密钥检测同时覆盖已知格式和没有固定形态的凭据，结果直接出现在审查评论里。"], "lessons": ["开启自动审查时，把默认改成按风险自适应，并单独打开密钥检测，避免只依赖合并后的 secret scanning。"]}, {"topic": "code-review", "date": "2026-11-20", "title": "REVAL：代码审查关闭意见需要随修订再验证的证据", "url": "https://arxiv.org/abs/2611.23275", "summary": "arXiv 2611.23275 认为，关闭讨论串或改掉被评论的那一行，并不能证明审查意见已经修好，后续修订还可能让已修复问题再次出现。作者把审查意见建模为持续的验证义务，并提出轻量流程 REVAL。在覆盖 441 条意见、1,284 次评估和 12 类缺陷的合成修订历史上，用“过期行仍视为已解决”的黏性代理会把 72.9% 的未解决状态误标为已解决；一旦首次检查通过就停止，则会漏掉全部复发。用 3 个由 oracle 抽样的见证时，REVAL 的误关闭率为 0.11（95% CI 0.06–0.16），复发检出率 80.4%；只用审查评论生成见证并在留出检查上评估时，这两个数字是 0.13 和 88.3%。在 6,420 对比较中，它与穷尽再评估一致，同时把评论后的测试执行量减少 34%。该结果限于受控合成历史，作者另给出了在真实审查历史上评估普适性的预注册方案。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["code-review", "REVAL", "verification", "review-resolution"], "links": {}, "highlights": ["仅凭行被改过或讨论被关闭，会把七成以上未解决状态误判为已修好，且会漏掉全部复发。", "在合成历史上，带依赖门控的再验证能与穷尽再评估一致，并把后续测试执行量减少约三分之一。"], "lessons": ["自动或人工关闭审查意见时，应保存可再跑的验证证据，并在相关代码再次变动时重新检查，而不是把“该行已改”当成修复完成。"]}, {"topic": "code-review", "date": "2026-11-20", "title": "单智能体代码审查并不弱于复杂的多智能体系统", "url": "https://arxiv.org/abs/2611.23283", "summary": "arXiv 2611.23283 系统比较了用于审查意见生成（RCG）和代码改进（CR）的多智能体与单智能体设计，对象包括 Hydra Reviewer 及其单智能体对照 C-ChatGPT，以及按质量维度拆分的 ReAct 多智能体与对应的单智能体 ReAct。结果显示，单智能体在两项任务上与多智能体相当，有时还更好，同时系统更简单、token 消耗更低；例如 C-ChatGPT 在 RCG 上的平均 token 为 1,610。作者据此质疑“复杂软件工程任务默认应上多智能体”的常见假设。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["code-review", "multi-agent", "single-agent", "Hydra-Reviewer"], "links": {}, "highlights": ["在审查意见生成和代码改进上，更简单的单智能体可以达到与多智能体相当甚至更好的效果。", "多智能体带来更高架构复杂度和计算开销，但并不自动转化成更好的审查质量。"], "lessons": ["上线审查 Agent 时，应先拿同样的提示和工具集对比单智能体基线，不要默认拆成多角色系统。"]}, {"topic": "code-review", "date": "2026-11-21", "title": "工业跟踪显示：审查规则被点名的次数，说明不了它是否有用", "url": "https://arxiv.org/abs/2611.25918", "summary": "一项针对 Kleene 系统的工业研究跟踪了把历史审查意见抽成规则、再交给语言模型用于后续改动的做法。65 天生产使用表明，后续评论点名某条规则的次数，既不能说明原文内容被保留，也不能说明评论真的要求了修改。在被点名的 12 条规则的 56 个条款里，只有 2 条能在原始审查线程中直接找到，38 条附加了原段落没有的条件，16 条找不到对应段落。464 条已部署规则中，只有 94 条（20.3%）对应到有记录的代码改动。在 20 个构造改动上，只提供未编辑原线程的审查模型与提供抽取规则的模型，检测差异的置信区间包含 0。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["code-review", "review-rules", "Kleene", "industrial-study"], "links": {}, "highlights": ["被后续评论点名的 56 个条款里，只有 2 条能在原始审查线程中直接找到。", "464 条已部署规则里，只有 20.3% 对应到有记录的代码改动；构造测试中，原线程与抽取规则的差异置信区间包含 0。"], "lessons": ["不要只用「规则被点名了多少次」来决定保留哪些自动抽取的审查规则，应逐阶段记录它是否催生了真实改动，并和原始审查线程对照。"]}, {"topic": "mcp", "date": "2026-10-24", "title": "SEP-2640 Skills over MCP 成为官方扩展", "url": "https://modelcontextprotocol.io/seps/2640-skills-extension", "summary": "通过 MCP Resources 分发 SKILL.md（skill:// URI），新增 skills/list、skills/get；要求内容哈希绑定审批、按服务端身份隔离命名空间、忽略远端 allowed-tools，并移除归档分发。", "source": "网页/文档", "agent": "MCP与Skills", "tags": ["mcp", "skills", "sep"], "links": {"spec": "https://plan.modelcontextprotocol.io/seps"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-24", "title": "MCP 2026-07-28 无状态核心规范", "url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/", "summary": "移除 initialize 握手、Mcp-Session-Id 与 GET SSE，单 POST 携带 _meta，用 Mcp-Method/Mcp-Name 头路由，以 MRTR input_required 替代服务端反向长连接。", "source": "网页/文档", "agent": "MCP与Skills", "tags": ["mcp", "spec"], "links": {"github": "https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/blog/content/posts/2026-07-28-spec-ga/index.md"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-24", "title": "SEP-3415 Events 扩展：轮询、流式、Webhook 三种事件投递", "url": "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/3415", "summary": "定义 events/list 与 poll、stream、subscribe（Standard Webhooks 签名）三种投递，支持游标续传，服务无人值守场景。", "source": "网页/文档", "agent": "MCP与Skills", "tags": ["mcp", "sep", "events"], "links": {}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-24", "title": "SEP-2848 工具调用异步审批", "url": "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2848", "summary": "可申请批准的拒绝返回 Task 句柄，带外审批后重验权限并以 at-most-once 执行，客户端用 tasks/get 轮询。", "source": "网页/文档", "agent": "MCP与Skills", "tags": ["mcp", "sep", "auth"], "links": {"spec": "https://plan.modelcontextprotocol.io/seps"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-24", "title": "SEP-2643 结构化授权拒绝", "url": "htt "https://plan.modelcontextprotocol.io/releases/2", "summary": "官方 Spec TPM 页显示 2026-12-15 版处于 DRAFT：11/15 合并并标记 SEP 为 final、发布 RC 并完成 SDK/客户端维护者签字；12/1 规范冻结，12/8 Tier 1 SDK 就绪。当前尚未登记已排期 SEP，路线主题含 Agent Identity and Enterprise-Ready Security 和 HTTP-Native Transport Unification。", "source": "网页/文档", "agent": "MCP", "tags": ["spec", "release"], "links": {"spec": "https://plan.modelcontextprotocol.io/seps"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-26", "title": "MCP Gateways 兴趣小组 10/21 例会：聚合与路由模式", "url": "https://meet.modelcontextprotocol.io/2026/10/gateways-interest-group-meeting-ySPsf95nY7CZ", "summary": "官方 Gateways Interest Group 在 10/21 讨论网关的聚合、路由实现与痛点，定位是收集社区对网关及相邻需求的讨论。", "source": "网页/文档", "agent": "MCP", "tags": ["gateway", "community"], "links": {}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-26", "title": "SEP-3440：组建 Tasks and Events 工作组，Agents 工作组降为兴趣小组", "url": "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/3440", "summary": "10/20 更新的提案（阶段 proposal）：成立 Tasks and Events Working Group，并把 Agents Working Group 转为 Interest Group。同期 SEP-2848（工具调用异步审批）10/20、SEP-2643（结构化授权拒绝）10/17、SEP-2778（类型约束，draft）10/21 均有更新；SEP-2792（按请求的用户语言偏好）10/17 状态为 accepted。", "source": "网页/文档", "agent": "MCP", "tags": ["sep", "tasks", "events"], "links": {"spec": "https://plan.modelcontextprotocol.io/seps"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-10-26", "title": "官方 MCP servers v2.1.0 安全发布：修复 3 个参考服务器的 8 个漏洞", "url": "https://github.com/modelcontextprotocol/servers/releases/tag/v2.1.0", "summary": "10/25 发布。server-filesystem、server-everything 升到 2.0.1，mcp-server-fetch 升到 2026.10.24。最重要的是 filesystem 的符号链接竞态：检查后把父目录换成 symlink 可让写入、编辑、建目录和 move 目标逃出允许目录；Linux/macOS 已修，Windows 仅部分修复。另修了路径末尾引号/空白被检查时剥离、实际使用时保留导致可访问同名兄弟目录的问题。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "security", "servers"], "links": {"github": "https://github.com/modelcontextprotocol/servers/security/advisories/GHSA-53mr-w429-c597", "blog": "https://dropagentic.com/mcp-servers-security-fix-eight-vulnerabilities/"}, "highlights": ["filesystem 在检查通过后如果父目录被换成符号链接，写入、编辑、建目录和移动都能逃出允许目录。", "Linux 和 macOS 已经修好，Windows 只修了一部分。", "路径末尾的引号或空白在检查时被去掉、真正使用时还在，因此可以访问同名的兄弟目录。"], "lessons": []}, {"topic": "mcp", "date": "2026-10-26", "title": "MCP Inspector 安全发布 2.12.0 / 1.0.3：恶意远程 Server 与 MCP App 可致本地 RCE", "url": "https://github.com/modelcontextprotocol/inspector/releases/tag/2.12.0", "summary": "10/21 发布。v1 线 1.0.3 修复两个 RCE：恶意 OAuth 回调可在 URL 里把传输切到 stdio 并执行任意命令（GHSA-4fc4-wcmh-4g86）；远程 MCP App 在同源沙箱里可窃取代理 auth token 后执行命令（GHSA-6x67-4w4w-9f3w，CVSS 9.6）。v2 线 2.12.0 修复 2.0.0–2.11.0 的三个漏洞，包括 OAuth 授权 URL 只允许 http(s) 打开。建议 npx @modelcontextprotocol/inspector@latest 升级。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "security", "oauth", "mcp-apps", "inspector"], "links": {"github": "https://github.com/modelcontextprotocol/inspector/releases/tag/1.0.3", "advisory": "https://github.com/modelcontextprotocol/inspector/security/advisories/GHSA-6x67-4w4w-9f3w"}, "highlights": ["1.0.3 修了两处远程代码执行：恶意 OAuth 回调可以把传输切到 stdio 并执行命令。", "放在同源沙箱里的 MCP App 能偷走代理的 auth token，再执行命令（CVSS 9.6）。", "2.12.0 修了 2.0.0 到 2.11.0 的三个漏洞，OAuth 授权地址只允许 http 或 https。"], "lessons": []}, {"topic": "mcp", "date": "2026-10-27", "title": "SEP-3398 已获通过：MCP 规范改为每年 3 月、9 月两次发布，原定 12 月版顺延到 2027 年 3 月底", "url": "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/3398", "summary": "Process 类 SEP，10/14 经 Core Maintainer 投票通过，10/26 PR 仍在更新文档（尚未合并）。规范每六个月发布一次，一般在 3 月和 9 月最后一个周二；每轮周期八个月、前后重叠两个月，设正副两位轮值 release manager 与统一 SEP 评审队列。过渡方案把 2026 年 12 月的发布目标挪到 2027 年 3 月底。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "spec", "sep", "release", "governance"], "links": {"spec": "https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/seps/index.mdx"}, "highlights": ["发布日不为未完成的提案让路：进版本的 SEP 必须在发布前 2.5 个月的软冻结前达到 Final 并合并，否则顺延到下一版。", "Tier 1 SDK 要在发布前 1.5 个月出 beta，发布前 1 个月硬冻结，之后只允许全体 CM 投票通过的安全或互操作紧急修复。", "过渡方案让此前公布的 11/15 RC、12/15 正式版排期不再是目标，下一版改为 2027 年 3 月底。"], "lessons": ["依赖新规范特性的路线图按 3 月、9 月两个窗口排期，并在 SDK beta 阶段就接入测试。", "想推动的 SEP 要提前找工作组或 CM 担保，赶在软冻结前做到 Final，包括一致性测试。"]}, {"topic": "mcp", "date": "2026-10-27", "title": "SEP-3118 撤回核心提案：MCP Apps 内渲染表单 elicitation 改在 ext-apps 扩展里推进", "url": "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/3118", "summary": "10/26 作者关闭核心规范 SEP-3118，理由是 App 渲染的表单 elicitation 只用到现有 elicitation 请求/结果结构、能力扩展点和 MRTR 流程，不需要改核心协议。方案整体并入 MCP Apps 扩展规范 ext-apps#733（仍在审），C# 与 TypeScript SDK 参考实现正按最新 main 刷新。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "mcp-apps", "elicitation", "sep", "mrtr"], "links": {"github": "https://github.com/modelcontextprotocol/ext-apps/pull/733"}, "highlights": ["能力仍放在 io.modelcontextprotocol/ui 扩展内协商，宿主用 ui.resourceUri 把 elicitation 路由给 App 渲染，标准表单 elicitation 作为互通兜底。", "2026-07-28 版下，服务端把 elicitation/create 放进 MRTR 的 InputRequiredResult，宿主把 App 返回的 ElicitResult 填进 inputResponses 后带 requestState 重试。"], "lessons": ["做 MCP Apps 的团队可以先按 ext-apps#733 设计表单交互，同时保留标准表单兜底，兼容不支持的宿主。"]}, {"topic": "mcp", "date": "2026-10-27", "title": "AGNTCon + MCPCon 北美回顾：SDK 累计下载 41.7 亿，议程重心转向安全与身份", "url": "https://www.infoq.com/news/2026/10/agntcon-mcpcon-2026/", "summary": "InfoQ 10/26 回顾 10/22–23 圣何塞大会。Den Delimarsky 称 SDK 累计下载 41.7 亿，116 个一致性场景约三分之一测安全，企业托管授权已在 Claude 上线，PoP 令牌和工作负载身份联邦处于草案。David Soria Parra 宣布 Claude Code 支持 MCP tasks；OpenAI 分享 ChatGPT 插件目录数据，要求每个工具都带 annotations。文中提示部分数字是台上说法，未附公开数据。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "mcpcon", "security", "auth", "tasks", "community"], "links": {}, "highlights": ["授权路线图：企业托管授权标为稳定，PoP 令牌与工作负载身份联邦为草案，终点是 agent 以自己的身份登录。", "OpenAI：约四分之三的工具 schema 小于 1 kB，超大 schema 会先被裁掉参数描述；缺少工具 annotations 的服务器会被拒收。", "部分平台约 70% 流量已走 2026-07-28 的无状态模式；Claude Code 的 MCP tasks 让工具调用可持续数分钟到数天。"], "lessons": ["自家 MCP 服务器给每个工具补 readOnly/destructive 等 annotations，并压小 schema，server instructions 控制在约 1000 字符内。", "认证方案提前为 agent 自有身份留位置，别长期依赖借来的用户 token。"]}, {"topic": "mcp", "date": "2026-10-27", "title": "官方 MCP C# SDK 2.0：HTTP 默认无状态、支持 MRTR 与可路由请求头", "url": "https://www.infoq.com/news/2026/10/mcp-csharp-sdk-stateless/", "summary": "InfoQ 10/26 报道微软发布的 C# SDK 2.0（实现 2026-07-28 规范）及随后的 2.1–2.3。去掉 initialize 握手和 Mcp-Session-Id，Stateless 默认 true；tools/call 带 Mcp-Method、Mcp-Name 头，网关可不读 body 路由；MRTR 用 InputRequiredException 取代调用中途反向请求。OAuth 更严格：RFC 9207 issuer 校验、要求 PKCE S256。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "sdk", "csharp", "stateless", "mrtr", "oauth"], "links": {"github": "https://github.com/modelcontextprotocol/csharp-sdk"}, "highlights": ["客户端先探测 server/discover，失败再回退旧握手；2.2 的 HttpServerSessionMode 让 2025-11-25 与 2026-07-28 客户端共用一个端点。", "Tasks 移到可选包 ModelContextProtocol.Extensions.Tasks，与 1.3/1.4 的实验版不兼容；MCP Apps 有实验包。", "2.3 把 ServerInfo 改为可空，并提醒不要用服务端自报身份做安全判断；团队下一步重点是端到端认证授权。"], "lessons": [".NET 服务升级前检查 Tasks 用法和长耗时 handler 的超时，必要时加进度输出。", "网关可以开始按 Mcp-Method/Mcp-Name 头做路由和限流，但以 body 为准并处理 HeaderMismatch。"]}, {"topic": "mcp", "date": "2026-10-27", "title": "官方 MCP Registry v1.8.5：发布校验更严，旧的无效仓库元数据重发时可能要修", "url": "https://github.com/modelcontextprotocol/registry/releases/tag/v1.8.5", "summary": "10/26 发布。新增生产性能诊断（请求积压、数据库连接池和慢查询日志）；publisher 修复 P-384 签名定宽、在 init 时记录 repository.id 以便仓库改名后仍可解析，支持 GitLab 嵌套子组 URL，并拒绝不完整的仓库元数据与无效参数类型。release 说明提示已存储的无效元数据在重新发布或编辑时可能需要更正。", "source": "网页/文档", "agent": "MCP", "tags": ["mcp", "registry", "publisher"], "links": {}, "highlights": [], "lessons": ["往官方 Registry 发布服务器的团队，下次发版前先用新版 mcp-publisher 校验 server.json 的 repository 和参数定义。"]}, {"topic": "mcp", "date": "2026-11-13", "title": "MCP 官宣半年一次规范发布，下一版目标 2027-03-30", "url": "https://blog.modelcontextprotocol.io/posts/mcp-release-cycle/", "summary": "2026-11-11，MCP 维护者在官方博客宣布，规范改为大致每半年发布一次，一般定在 3 月和 9 月的最后一个周二；下一版目标是 2027-03-30，版本号预计为 2027-03-30。SEP-3398 成为现行发布指引。未就绪的提案将延后到后续版本，而不是推迟整次规范发布。同时正式设立 Release Manager，Luca Chang 将与 Den Delimarsky、David Soria Parra 一起负责下一周期。公告明确：这只改变准备发布的方式，不改变现有 MCP 消息或版本协商，已有客户端和服务器不必因此改代码。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["mcp", "sep", "release-cycle", "governance"], "links": {"spec": "https://modelcontextprotocol.io/seps/3398-release-cycle-updates"}, "highlights": ["规范节奏被固定为每年两次，并以推迟单个提案来保住发布日期。", "发布准备流程与协议本身解耦，现有实现对这次公告无需改动。"], "lessons": ["若要跟进 MCP 规范，应按 2027-03-30 倒排提案冻结和 SDK beta 时间，而不是等到发布当周再适配。"]}, {"topic": "mcp", "date": "2026-11-13", "title": "MCP 推出实验性文件上传下载扩展 io.modelcontextprotocol/files", "url": "https://blog.modelcontextprotocol.io/posts/exploring-file-uploads-and-downloads-in-mcp/", "summary": "2026-11-10，MCP 官方博客介绍仍在实验中的文件扩展 io.modelcontextprotocol/files，适用于 2026-07-28 及之后的协议修订，用于在客户端与工具之间传递 PDF、CSV、压缩包等文件，而不让模型直接读取全部字节。服务器可在发现响应中声明是否接受带外或内联上传，客户端在请求元数据中声明上传/下载能力。扩展仍是可选的，目前没有参考实现，维护者希望在年底前稳定。实验仓库为 modelcontextprotocol/experimental-ext-file-uploads。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["mcp", "extension", "files", "gateway"], "links": {"github": "https://github.com/modelcontextprotocol/experimental-ext-file-uploads"}, "highlights": ["文件应直接到达目的地，由协议传递文件元数据和传输目标，而不是塞进模型上下文。", "该扩展目前是实验性、可选的，维护者邀请社区一起试，并计划在年底前争取稳定。"], "lessons": ["若 Agent 需要把大文件交给远程工具或网关，应跟踪该扩展并注意目标地址与凭证传递的安全限制，而不是各自约定专用工具。"]}, {"topic": "mcp", "date": "2026-11-13", "title": "mcp-gateway-registry 于 11 月 11 日公开两项高危公告：SSRF 与管理接口提权", "url": "https://github.com/agentic-community/mcp-gateway-registry/security/advisories/GHSA-fc39-fwh3-wv5r", "summary": "2026-11-11，开源项目 mcp-gateway-registry（用于 MCP 服务器发现、访问控制和工具代理）公开两项 High 级别安全公告。GHSA-fc39-fwh3-wv5r 是服务器注册/更新接口中的服务端请求伪造，影响 1.0.3 至 1.34.0，已在 1.35.0 修复：已认证且有权注册或修改服务器的用户，可能让网关向其本不能直接访问的内部地址发起请求，在部分部署中还包括云实例元数据。GHSA-rxf3-qgpv-wxvr 是外部管理 API 认证后未做授权校验，影响 1.0.9 至 1.24.7，已在 1.25.0 修复：低权限认证用户可能把自己提升为注册表管理员。1.25.0 已包含提权修复，但仍受 SSRF 影响，建议升级到 1.35.0 或更高，并按公告审查已登记的上游地址、权限映射和日志。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["mcp", "gateway", "security", "advisory"], "links": {"docs": "https://github.com/agentic-community/mcp-gateway-registry/security/advisories/GHSA-rxf3-qgpv-wxvr"}, "highlights": ["两项高危问题分别出在上游地址校验和管理接口授权，都需要已认证用户，但权限要求不同。", "只升到 1.25.0 还不够，SSRF 要到 1.35.0 才修复；升级后仍需检查升级前写入的配置。"], "lessons": ["自建 MCP Gateway 或 Registry 时，应限制谁能登记上游地址，并对管理 API 做基于角色的授权；已部署 1.34.0 及更早版本的应尽快升到 1.35.0 以上并复查配置。"]}, {"topic": "mcp", "date": "2026-11-14", "title": "MCP 官方 servers v2.4.0 修复 filesystem/git/fetch 六个漏洞", "url": "https://github.com/modelcontextprotocol/servers/releases/tag/v2.4.0", "summary": "server-filesystem 升至 2.3.0（修 TOCTOU 符号链接竞争、move_file 越界），mcp-server-git 与 mcp-server-fetch 升至 2026.11.11（仓库 .git/config 不再能让只读调用执行程序；alternates/worktree 越界；IPv6 site-local 视为私有；robots.txt 路径归一化）。注意日期版本号的 npm 包管理器不会自动升级到 2.3.0，需显式安装。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["mcp", "security", "servers"], "links": {}, "highlights": ["git server 的只读调用曾可因不可信仓库的 core.fsmonitor 等配置执行命令", "Windows 上符号链接竞争与目录 junction 仍未完全修复"], "lessons": ["检查本机 MCP 配置中的 filesystem/git/fetch 版本，日期版本需手动安装 2.3.0"]}, {"topic": "mcp", "date": "2026-11-14", "title": "Sitecore Developer MCP Server 进入 Beta", "url": "https://doc.sitecore.com/changelog/sitecoreai/13112026/sitecore-developer-mcp-server-released-in-beta", "summary": "提供 13 个工具覆盖组件开发、内容建模、站点发现与内容创建，支持 VS Code、Cursor、Claude Code、Codex、OpenCode，通过 MCP OAuth 认证。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["mcp", "oauth", "ecosystem"], "links": {}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-11-15", "title": "FastMCP 4.2「Mad Skills」：MCP 服务器托管 Agent Skills", "url": "https://github.com/PrefectHQ/fastmcp/releases/tag/v4.2.0", "summary": "2026-11-13 发布：服务器可用 SkillCatalogProvider 托管 skill，客户端以 resource 读取并带大小/摘要校验安装；4.1 skills API 弃用、4.3 移除；要求 Python 3.11+，3.10 用户需 pin fastmcp\u003c4.2。", "source": "网页/文档", "agent": "AI前沿者", "tags": [], "links": {"blog": "https://www.prefect.io/blog/fastmcp-4-2-skills-over-mcp", "docs": "https://gofastmcp.com/docs/servers/skills"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-11-15", "title": "Claude 自定义连接器要求远程 MCP 服务器监听 443 端口", "url": "https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp", "summary": "Claude 帮助文档更新：远程 MCP 必须可经标准 HTTPS 443 访问，带其他端口的 URL 无法连接；URL 需按提供方文档原样填写含路径；自带 OAuth 客户端时回调为 claude.ai/api/mcp/auth_callback；本地 MCP 仅本地运行的 Cowork 可用。", "source": "网页/文档", "agent": "AI前沿者", "tags": [], "links": {"analysis": "https://docswatch.stevetoth.ai/anthropic/custom-connectors-remote-mcp/2026-11-14/"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-11-15", "title": "Wise 推出官方只读 MCP 服务器", "url": "https://docs.wise.com/mcp/overview", "summary": "Wise for AI 提供 15 个只读工具、7 个权限组，可在 ChatGPT/Claude 中查余额、转账、收款人与汇率，不能动钱；按授予权限暴露工具，起草转账为「即将推出」。", "source": "网页/文档", "agent": "AI前沿者", "tags": [], "links": {"website": "https://wise.com/us/business/wise-for-ai-mcp"}, "highlights": [], "lessons": []}, {"topic": "mcp", "date": "2026-11-19", "title": "Code mode 可比普通 MCP 少用七到九成 token，额外路由层未证实更优", "url": "https://arxiv.org/abs/2611.19123", "summary": "论文在受控环境里比较普通 MCP、Code mode（对工具桩写脚本）和决策层（先用便宜路由器筛选工具子集）。实验覆盖 12 个服务器、最多 1,958 个干扰工具，以及 Qwen、Gemma、Nemotron 三个开权模型，并在预先登记的密封测试集上评测。Code mode 明显好于普通 MCP，token 用量减少 70% 到 90%，效用也显著提高。在代码桩里声明返回值结构是一阶因素，对较弱模型的成功率最大可相差 39.5 个百分点，影响超过再加一层路由器。作者预先假设的“决策层加 Code mode 优于单独 Code mode”未被证实：对较弱模型只有不显著的小幅提升，对最强模型还略增成本。工具选择微调模型、评测工具和全部轨迹已公开。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["MCP", "code-mode", "gateway", "tool-use"], "links": {"paper": "https://arxiv.org/abs/2611.19123", "github": "https://github.com/abhishek085/mcp-decision-layer"}, "highlights": ["让 Agent 对工具桩写代码，比直接在 MCP 目录里挑工具更省 token，也更容易成功。", "桩上的返回值结构说明很关键；在 Code mode 前再加一层决策路由，并没有被证实更好。"], "lessons": ["MCP 网关若工具很多，可优先尝试 Code mode 和清晰的返回值约定，而不是先上复杂的路由层。"]}, {"topic": "mcp", "date": "2026-11-19", "title": "MCP 工具名不等于提供者身份，同名或更像权威的描述会造成误绑定", "url": "https://arxiv.org/abs/2611.21577", "summary": "新不伦瑞克大学加拿大网络安全研究所的论文把这类问题称作 tool-provider misbinding：请求本该打到合法提供者，却被解析到攻击者控制的工具。攻击者不必攻破主机、模型、合法服务器或网络，只需再运行一个 MCP 服务器并自行撰写工具元数据。作者在受控 MCP 环境中评测了五个基于 LLM 的客户端。最严重的失败出现在工具名完全相同、描述贴合任务、参数结构也兼容同时成立时；即便没有同名，只靠看起来更权威的描述加上兼容 schema，也可能造成错误执行，或让客户端无法确定该用哪一家。不同模型暴露同一弱点的方式不同，包括直接选中攻击者、发起澄清，以及提供者解析不稳定。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["MCP", "security", "tool-identity", "misbinding"], "links": {"paper": "https://arxiv.org/abs/2611.21577"}, "highlights": ["MCP 用来做发现和选择的工具元数据，本身并不必然绑定到经过验证的提供者身份。", "攻击者只要再挂一个同名或描述更像权威的服务器，就可能把调用抢走，不必攻破原有系统。"], "lessons": ["接入多个 MCP 服务器时，应对工具名和来源做身份约束，不能只靠名字或描述来决定调用谁。"]}, {"topic": "mcp", "date": "2026-11-20", "title": "Amazon Cognito 为 MCP 客户端增加 CIMD 和动态客户端注册", "url": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-client-id-metadata-documents/", "summary": "AWS 于 2026-11-19 宣布 Amazon Cognito 支持 OAuth 客户端标识元数据文档（CIMD）和动态客户端注册（DCR，RFC 7591），面向为 MCP 服务器做授权的场景。有了 CIMD，MCP 客户端可用 HTTPS URL 作为 client ID 并在该地址发布 JSON 元数据，Cognito 在登录时拉取并校验；运营方用 URL 模式策略把它映射到已有应用客户端，且只授予应用客户端和元数据文档共同允许的 scope 与授权类型，从而不必为每个外部助手单独创建和清理应用客户端。DCR 则在授权服务器元数据中公布注册端点，MCP 客户端可在运行时注册并获得 client ID；可要求带注册 scope 的访问令牌，也可开放注册。动态注册的客户端带有可筛选的 ID 前缀和类型。两项能力均在 Essentials 和 Plus 套餐、Cognito 全部可用区域提供。", "source": "网页/文档", "agent": "AI前沿者", "tags": ["MCP", "Cognito", "CIMD", "DCR", "auth"], "links": {"blog": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-dynamic-client-registration/", "docs": "https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-client-id-metadata.html", "dcr-docs": "https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-dynamic-client-registration.html"}, "highlights": ["CIMD 让 MCP 客户端用自己的 HTTPS 身份登录，服务方不必为每个助手预创建应用客户端。", "Cognito 同时提供 DCR，便于仍按运行时注册方式实现的 MCP 客户端接入，并可限制谁能注册。"], "lessons": ["用 Cognito 保护远程 MCP 服务器时，优先评估 CIMD 策略映射；若必须兼容动态注册，应关闭完全开放注册或加上注册 scope。"]}, {"topic": "mcp", "date": "2026-11-20", "title": "SEP-3567 提案：已获赞助但长期停更的 draft SEP 将进入休眠", "url": "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/3567", "summary": "MCP 维护者 dend 于 2026-11-18 提交、11-19 仍有更新的治理提案 SEP-3567，目前为 draft，赞助人为 localden。提案规定：处于 draft 的 SEP 若连续 180 天没有作者或赞助人的提交、评论或评审，将标记为 d   if (under(h, "x.com") || under(h, "twitter.com")) return "x";
  if (under(h, "youtube.com") || h === "youtu.be") return "youtube";
  if (under(h, "reddit.com")) return "reddit";
  if (h === "news.ycombinator.com") return "hn";
  if (under(h, "pypi.org") || h === "pypi.python.org") return "pypi";
  if (under(h, "npmjs.com") || under(h, "npmjs.org")) return "npm";
  if (under(h, "discord.com") || h === "discord.gg" || under(h, "discordapp.com")) return "discord";
  if (under(h, "huggingface.co") || h === "hf.co") return seg[0] === "datasets" ? "dataset" : "hf";
  if (["medium.com", "substack.com", "dev.to", "bearblog.dev", "hashnode.dev", "wordpress.com"].some(d => under(h, d))) return "blog";
  if (under(h, "readthedocs.io") || under(h, "gitbook.io")) return "docs";
  if (h.startsWith("blog.")) return "blog";
  if (h.startsWith("docs.")) return "docs";
  if (h.startsWith("spec.")) return "spec";
  if (h.startsWith("demo.")) return "demo";
  const table = [
    ["blog", ["blog", "news", "posts", "post", "articles", "article", "research", "research-notes"]],
    ["docs", ["docs", "doc", "documentation", "guide", "guides", "reference"]],
    ["spec", ["seps", "sep", "spec", "specs", "specification", "rfc"]],
    ["leaderboard", ["leaderboard", "leaderboards", "benchmarks"]],
    ["dataset", ["datasets", "dataset"]],
    ["demo", ["demo", "playground"]]
  ];
  for (const s of seg) {
    for (const [type, names] of table) if (names.includes(s)) return type;
  }
  if (h.startsWith("developers.") || h.startsWith("developer.")) return "docs";
  if (h.endsWith(".github.io")) return "docs";
  return "link";
}
function norm(url) {
  try {
    const u = new URL(url);
    const h = hostOf(u);
    return u.protocol + "//" + h + u.pathname.replace(/\/+$/, "") + u.search;
  } catch { return String(url || "").trim(); }
}
function safeHttp(url) { return /^https?:\/\//i.test(url || ""); }
function resources(item) {
  const explicit = [];
  const seen = new Set();
  for (const [type, url] of Object.entries(item.links || {})) {
    if (!safeHttp(url)) continue;
    const n = norm(url);
    if (seen.has(n)) continue;
    seen.add(n);
    explicit.push({ type, url, n });
  }
  const out = [];
  const shown = new Set();
  if (safeHttp(item.url)) {
    const n = norm(item.url);
    out.push({ type: detect(item.url), url: item.url });
    shown.add(n);
  }
  for (const e of explicit) {
    if (shown.has(e.n)) continue;
    shown.add(e.n);
    out.push({ type: e.type, url: e.url });
  }
  return out;
}
function iconLink(type, url) {
  const name = labelOf(type);
  return `<a class="iconbtn" data-type="${esc(type)}" data-label="${esc(name)}" href="${esc(url)}" target="_blank" rel="noopener" aria-label="${esc(name)}"><svg viewBox="0 0 24 24" aria-hidden="true">${iconOf(type)}</svg></a>`;
}

let cur = "all";
const latest = D.map(x => x.date).sort().at(-1) || "—";
document.getElementById("sub").textContent = `共 ${D.length} 条 · 更新至 ${latest}`;

function fromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!h || h === "all") return "all";
  return Object.prototype.hasOwnProperty.call(T, h) ? h : "all";
}
const narrow = () => window.matchMedia("(max-width: 899px)").matches;
function syncBar() {
  const side = document.querySelector(".side");
  const h = narrow() ? side.offsetHeight : 0;
  document.documentElement.style.setProperty("--bar-h", h + "px");
}
function topicName(k) { return k === "all" ? "全部" : (T[k] || k); }
function countOf(k) { return k === "all" ? D.length : D.filter(x => x.topic === k).length; }
function rawHash() { return decodeURIComponent(location.hash.replace(/^#/, "")); }
function readHash() {
  const next = fromHash();
  if (rawHash() !== next) history.replaceState(null, "", "#" + next);
  return next;
}
function paintNav() {
  const nav = document.getElementById("nav");
  const sel = document.getElementById("topic");
  if (!nav.childElementCount) {
    for (const k of ORDER) {
      const name = topicName(k);
      const n = countOf(k);
      const a = document.createElement("a");
      a.className = "nav-item";
      a.href = "#" + k;
      a.dataset.key = k;
      if (k !== "all") a.dataset.topic = k;
      a.innerHTML = `<span class="name">${topicIcon(k)}<span class="label">${esc(name)}</span></span><span class="n">${n}</span>`;
      nav.appendChild(a);
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = name + " · " + n;
      sel.appendChild(opt);
    }
  }
  for (const a of nav.querySelectorAll(".nav-item")) {
    if (a.dataset.key === cur) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  if (sel.value !== cur) sel.value = cur;
  const mark = document.getElementById("topic-mark");
  if (cur === "all") mark.removeAttribute("data-topic");
  else mark.dataset.topic = cur;
  mark.innerHTML = topicIcon(cur);
  document.title = topicName(cur) + " · AI 雷达 - 社区";
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const name = cur === "all" ? "全部" : T[cur];
  const hay = x => [x.title, x.summary, ...(x.highlights || []), ...(x.lessons || []), ...(x.tags || [])].join("\n").toLowerCase();
  const xs = D.filter(x => (cur === "all" || x.topic === cur) && (!q || hay(x).includes(q)));
  xs.sort((a, b) => a.date === b.date ? 0 : (a.date < b.date ? 1 : -1));
  const hint = document.getElementById("hint");
  hint.textContent = q ? `在「${name}」中 ${xs.length} 条匹配` : "";
  const list = document.getElementById("list");
  if (!xs.length) {
    const msg = q || cur === "all" ? "没有匹配的内容" : "这个专题还没有条目";
    list.innerHTML = `<p class="empty">${msg}</p>`;
    return;
  }
  const groups = [];
  for (const x of xs) {
    if (!groups.length || groups[groups.length - 1].date !== x.date) groups.push({ date: x.date, items: [x] });
    else groups[groups.length - 1].items.push(x);
  }
  list.innerHTML = groups.map(g => {
    const cards = g.items.map(card).join("");
    return `<section><h2 class="day"><span>${esc(g.date)}</span><span class="c">${g.items.length} 条</span></h2>${cards}</section>`;
  }).join("");
}
function bulletBlock(items, title, kind, divided) {
  const xs = (Array.isArray(items) ? items : []).map(s => String(s).trim()).filter(Boolean);
  if (!xs.length) return "";
  const cls = divided ? `block ${kind}` : `block ${kind} block-first`;
  return `<section class="${cls}"><h4>${title}</h4><ul>${xs.map(t => `<li>${linkify(t)}</li>`).join("")}</ul></section>`;
}
function card(x) {
  const icons = resources(x).map(r => iconLink(r.type, r.url)).join("");
  const title = safeHttp(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title);
  const chips = [];
  if (cur === "all") chips.push(`<span class="chip">${topicIcon(x.topic)}${esc(T[x.topic] || x.topic)}</span>`);
  const kicker = chips.length ? `<div class="kicker">${chips.join("")}</div>` : "";
  const tags = (x.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const prose = String(x.summary || "").trim();
  const highlightItems = Array.isArray(x.highlights) ? x.highlights : [];
  const hasHighlights = highlightItems.some(s => String(s).trim());
  const summary = prose && !hasHighlights ? `<p class="summary">${linkify(prose)}</p>` : "";
  const highlights = bulletBlock(x.highlights, "摘要", "highlights", !!summary);
  const lessons = bulletBlock(x.lessons, "启示", "lessons", !!(summary || highlights));
  const actions = icons ? `<div class="actions"><div class="icons">${icons}</div></div>` : "";
  return `<article class="card" data-topic="${esc(x.topic)}">
    ${kicker}
    <h3>${title}</h3>
    ${summary}
    ${highlights}
    ${lessons}
    <div class="meta"><time datetime="${esc(x.date)}">${esc(x.date)}</time>${tags}</div>
    ${actions}
  </article>`;
}
function paint() { paintNav(); render(); syncBar(); }
document.getElementById("q").addEventListener("input", () => { render(); syncBar(); });
document.getElementById("topic").addEventListener("change", () => {
  const k = document.getElementById("topic").value;
  if (rawHash() !== k) location.hash = k;
});
window.addEventListener("hashchange", () => {
  const next = readHash();
  const changed = next !== cur;
  cur = next;
  paint();
  if (changed) window.scrollTo(0, 0);
});
window.addEventListener("resize", syncBar);
if (window.ResizeObserver) new ResizeObserver(syncBar).observe(document.querySelector(".side"));
cur = readHash();
paint();
</script>
</body>
</html>
